name: Release Package

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release
        id: release
        uses: cycjimmy/semantic-release-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so start the publish run explicitly.
      - name: Trigger pub.dev publish
        if: steps.release.outputs.new_release_published == 'true'
        run: gh workflow run publish.yml --ref "v${{ steps.release.outputs.new_release_version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
